# CI y deploy.
# - check y e2e: en cada PR y en cada push a develop/main.
# - deploy: solo en push a main (al mergear un PR) y solo si check y e2e pasaron. Publica el
#   Worker (app + API) con el token de Cloudflare del environment `production`, que GitHub solo
#   le da a jobs sobre main. La base NO se migra acá: `npm run db:push` se corre a mano antes
#   de mergear un cambio de esquema (docs/puesta-en-marcha.md).
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  # En PRs se cancela la corrida vieja; en develop/main no, para no cortar un deploy a la mitad.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validación del banco de palabras
        run: npm run validate -w words
      - run: npm run build
      - name: El banco generado coincide con el versionado
        run: git diff --exit-code -- words/bank app/public/words
      - name: Chequeo de claves en app/dist
        run: npm run check:secrets

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e -w app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Banco de palabras y app (app/dist): el Worker los publica como assets.
      - run: npm run build
      - name: Deploy del Worker (app + API)
        run: npm run deploy -w api
