name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validación del banco de palabras
        run: npm run validate -w words
      - run: npm run build
      - name: El banco generado coincide con el versionado
        run: git diff --exit-code -- words/bank app/public/words
      - name: Chequeo de claves en app/dist
        run: npm run check:secrets
